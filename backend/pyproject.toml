[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-analysis-backend"
version = "0.1.0"
description = "Backend of the time series visualization and analysis subsystem for web-based robotic systems"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "orjson>=3.10",
    "redis>=5.0",
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "questdb>=2.0",
]

[project.optional-dependencies]
# Replay / export scripts (reading large CSV/Parquet files, sending packets).
scripts = [
    "pandas>=2.2",
    "pyarrow>=16",
    "websockets>=12",
    "httpx>=0.27",
]
# Offline model training.
ml = [
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "pandas>=2.2",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fakeredis[lua]>=2.23",
]

[tool.setuptools.packages.find]
include = ["tsa_core*", "app*", "workers*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
